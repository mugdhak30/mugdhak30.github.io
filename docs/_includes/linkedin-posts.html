<!-- Static cards for featured LinkedIn posts, from _data/linkedin.yml. -->
<div class="li-posts">
{% for post in site.data.linkedin limit: 3 %}
  <article class="li-post{% unless post.image %} li-post--text-only{% endunless %}">
    <header>
      <svg class="li-post-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
      <div class="li-post-who">
        <span class="li-post-author">{{ site.author.name }}</span>
        {% if site.author.linkedin_headline %}<span class="li-post-headline">{{ site.author.linkedin_headline }}</span>{% endif %}
      </div>
      <span class="li-post-date">{{ post.date | date: "%b %Y" }}</span>
    </header>
    {% if post.image %}<img src="{{ post.image | relative_url }}" alt="">{% endif %}
    <div class="li-post-text">{{ post.text | markdownify }}</div>
    <a class="li-post-link" href="{{ post.url }}">View on LinkedIn →</a>
  </article>
{% endfor %}
</div>
