# Places shown on the maps on /talks/ and /year-archive/.
#
# Each key is a short id. Use it in:
#   - a talk stop in _data/talks.yml          (place: lisbon)
#   - a poster in _data/posters.yml           (place: melbourne)
#   - a blog post's front matter              (places: [lisbon])
#
# Only list places that one of those uses: this file is public on GitHub.
#
#   name: shown on the map and in lists
#   cc:   two-letter country code, see _data/countries.yml
#   lat / lng: decimal coordinates (right-click a spot in Google Maps to copy them)

