    Excited to be in Rio for ICSE - International Conference on Software Engineering 2026! 🇧🇷 I already had the chance to present our paper "Challenges in Android Data Disclosure: An Empirical Study" at MOBILESoft, and I’m happy to share that it received an Honourable Mention for Best Presentation 🎉

    Here's the preprint of our paper: https://lnkd.in/gpwUHkRm

    I’ll be here for the full ICSE week, so if you’re interested in static analysis, data protection, or empirical software engineering, I’d love to connect and chat. I’m also currently looking for a postdoc starting in Fall 2026, so if you know of opportunities or would like to discuss possible fits, please feel free to reach out.

    And if you’re at the conference reception tonight, come say hi! 😊

