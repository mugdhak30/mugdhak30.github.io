- date: 2025-10-31
  url: https://www.linkedin.com/posts/mugdha-khedkar-1410a3102_knowledgenet-epn-activity-7390034778466627584-uWFY
  image: /assets/linkedin/7390034778466627584.jpg
  text: |
    I had a great time organizing a workshop session at the IAPP European Privacy #KnowledgeNet (#EPN) in Munich. 🎉
    Huge thanks to Markus Sullivan for the opportunity, and to Jira-jane Pravitra and Kai Döpel for all your help in making it happen. 🙌

    We kicked things off with an interactive discussion on the pain points of privacy assessments, followed by a deep dive into how automation can support the process — a topic closely tied to my PhD research. The discussion was incredibly insightful — not only did I get validation that my PhD research is tackling a real problem, but I also walked away with fresh ideas to continue this line of work.

    Thanks to everyone who joined and contributed such thoughtful insights. Your input means a lot! 💡
