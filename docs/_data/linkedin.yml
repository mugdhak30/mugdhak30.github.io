- date: 2026-09-06
  url: https://www.linkedin.com/posts/mugdha-khedkar-1410a3102_phd-phddefended-gdpr-activity-7502340869019271168-SSo8
  image: /assets/linkedin/7502340869019271168.jpg
  text: |
    🎓 I'm thrilled to share that I've successfully defended my PhD thesis!

    My research sat at the intersection of GDPR compliance and software engineering, building tools to help stakeholders navigate data protection requirements - from developer-facing views to automated Records of Processing Activities (RoPA) generation.

    Working on an inter-disciplinary topic was genuinely difficult, and there were moments I wished I'd picked something simpler. Bridging legal and technical perspectives means constantly translating between worlds that don't always speak the same language. But the satisfaction of building something that could actually help privacy practitioners and developers make sense of GDPR compliance kept me going through the hardest parts.

    I'm deeply grateful to my advisor Eric Bodden for his constant support, and my committee members Mohamed Soliman, Awais Rashid, Ben Hermann, and Arnab Sharma for their reviews and time.

    This chapter is closing soon, but I'm very excited for what's next! 🚀
    \#PhD #PhDDefended #GDPR #SoftwareEngineering #Privacy #Research

