# Services shown on /services/.
#
# To add a service, copy an entry and edit it. Entries are grouped by year and
# listed newest first automatically; within a year they keep the order here.
# Something that spans several years goes under its most recent year, with
# the full span in `detail`.
#
#   role:    small label above the name (Program Committee, Artifact Evaluation, ...)
#   name:    venue or programme name
#   url:     optional link for the name
#   detail:  optional text after the name (track, dates, ...)
#   year:    year the entry is grouped under

