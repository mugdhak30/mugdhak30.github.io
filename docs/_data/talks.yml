# Talks shown on /talks/.
#
# To add a talk, copy an entry and edit it. To add another place where you
# gave an existing talk, add one more item under its `stops`.
# Talks are grouped by year and listed newest first automatically.
#
#   abbr:   text on the coloured badge
#   badge:  badge colour class from _sass/custom.scss
#           (invited-talk, industry-talk, pub-mobilesoft, pub-icse, pub-asew, workshop, phd-defense, ...)
#   kind:   optional small label next to the badge
#   award:  optional
#   stops:  one item per time the talk was given
#     venue, flag, date ("YYYY-MM") are required; url and co_label/co_url are optional

